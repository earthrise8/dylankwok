<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Dylan Kwok's Teams and Leadership - Competitive teams, clubs, and organizational roles.">
    <meta name="keywords" content="teams, leadership, rocketry, CubeSat, maker club, Dylan Kwok">
    <meta name="author" content="Dylan Kwok">
    <meta property="og:title" content="Dylan Kwok - Teams">
    <meta property="og:description" content="Team leadership, clubs, and organizational roles">
    <meta property="og:type" content="website">
    <title>Dylan Kwok - Teams</title>
    <link rel="icon" type="image/svg+xml" href="Dfavicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Space Grotesk', sans-serif;
            background:
                radial-gradient(circle at top, rgba(239, 68, 68, 0.08), transparent 28%),
                radial-gradient(circle at top right, rgba(56, 189, 248, 0.10), transparent 20%),
                linear-gradient(180deg, #020617 0%, #0f172a 42%, #020617 100%);
        }

        h1, h2, h3, h4, h5, h6, .mono {
            font-family: 'IBM Plex Mono', monospace;
        }
    </style>
    <style>
        :root { --nav-height: 4rem; }

        #site-tabs {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 40;
            display: flex;
            justify-content: center;
            padding: 0.5rem 1rem;
            background: linear-gradient(180deg, rgba(6,6,8,0.95), rgba(6,6,8,0.6));
            backdrop-filter: blur(6px);
        }

        #top-fade {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 6rem;
            pointer-events: none;
            z-index: 30;
            background: linear-gradient(to bottom, rgba(5,5,5,0.88) 0%, rgba(5,5,5,0.58) 52%, rgba(5,5,5,0) 100%);
        }

        .tab { transition: color .12s ease, border-color .12s ease; padding-bottom: .35rem; }
        .tab.active { border-bottom-color: #38bdf8 !important; color: #38bdf8 !important; }
    </style>
    <link rel="stylesheet" href="theme.css">
</head>
<body class="space-theme text-white">
    <div id="site-chrome-top"></div>

    <header class="border-b border-white/10 px-4 pt-28 pb-12 sm:px-6 lg:pt-32">
        <div class="mx-auto max-w-7xl">
            <p class="label text-blue-300">Team Operations / Leadership</p>
            <div class="mt-5 grid gap-8 lg:grid-cols-[1fr_0.9fr] lg:items-end">
                <div>
                    <h1 class="text-5xl font-semibold tracking-tight text-white sm:text-6xl lg:text-7xl">Teams</h1>
                    <p class="mt-5 max-w-3xl text-lg leading-8 text-zinc-300 sm:text-xl">Organizations, crews, and leadership roles presented separately from personal build work. This section is meant to read like a formal operations record: concise, technical, and easy to scan on a resume.</p>
                </div>
                <div class="grid grid-cols-3 gap-3 text-center text-xs uppercase tracking-[0.25em] text-zinc-300">
                    <div class="rounded-2xl border border-white/10 bg-white/5 px-3 py-4">Rocketry</div>
                    <div class="rounded-2xl border border-white/10 bg-white/5 px-3 py-4">Clubs</div>
                    <div class="rounded-2xl border border-white/10 bg-white/5 px-3 py-4">Systems</div>
                </div>
            </div>
        </div>
    </header>

    <main class="px-4 py-16 sm:px-6 lg:py-20">
        <div class="mx-auto max-w-7xl">
            <div id="teams-container" class="space-y-8"></div>
        </div>
    </main>

    <div id="site-chrome-bottom"></div>

    <script src="site-chrome.js"></script>

    <script>
        function buildTeamCard(team, index) {
            const image = team.images?.[0];
            const extraImages = team.images?.slice(1, 3) ?? [];

            return `
                <article id="team-${team.id}" class="panel overflow-hidden rounded-[2rem] team-anchor">
                    <div class="grid lg:grid-cols-[0.95fr_1.05fr]">
                        <div class="relative min-h-[18rem] bg-black">
                            ${image ? `<img src="${image.url}" alt="${team.title}" class="h-full w-full object-cover">` : ''}
                            <div class="absolute inset-0 bg-gradient-to-t from-black via-black/20 to-transparent"></div>
                            <div class="absolute left-5 top-5 rounded-full border border-red-400/40 bg-black/80 px-3 py-1 text-[11px] uppercase tracking-[0.3em] text-red-300">${String(index + 1).padStart(2, '0')}</div>
                        </div>
                        <div class="p-6 sm:p-8 lg:p-10">
                            <div class="flex flex-wrap items-center gap-3">
                                <span class="label text-blue-300">Team / Organization</span>
                                <span class="rounded-full border border-blue-400/35 bg-white px-3 py-1 text-xs font-semibold text-black">${team.status}</span>
                            </div>
                            <h2 class="mt-4 text-3xl font-semibold tracking-tight text-white sm:text-4xl">${team.title}</h2>
                            <p class="mt-3 text-sm uppercase tracking-[0.2em] text-zinc-400">${team.organization} • ${team.timeframe}</p>
                            <p class="mt-6 text-base leading-7 text-zinc-300">${team.description}</p>

                            <div class="mt-8 grid gap-6 sm:grid-cols-2">
                                <div>
                                    <h3 class="text-sm uppercase tracking-[0.25em] text-zinc-400">Responsibilities</h3>
                                    <ul class="mt-4 space-y-3 text-sm leading-6 text-zinc-300">
                                        ${team.accomplishments.map(item => `<li class="border-l border-red-400/40 pl-3">${item}</li>`).join('')}
                                    </ul>
                                </div>
                                <div>
                                    <h3 class="text-sm uppercase tracking-[0.25em] text-zinc-400">Systems Used</h3>
                                    <ul class="mt-4 space-y-3 text-sm leading-6 text-zinc-300">
                                        ${team.technologies.map(item => `<li class="border-l border-blue-400/40 pl-3">${item}</li>`).join('')}
                                    </ul>
                                </div>
                            </div>

                            ${extraImages.length ? `
                                <div class="mt-8 grid grid-cols-2 gap-3">
                                    ${extraImages.map(photo => `
                                        <div class="overflow-hidden rounded-2xl border border-white/10">
                                            <img src="${photo.url}" alt="${photo.caption}" class="h-28 w-full object-cover transition duration-300 hover:scale-105">
                                        </div>
                                    `).join('')}
                                </div>
                            ` : ''}
                        </div>
                    </div>
                </article>
            `;
        }

        // Ensure anchors land below the fixed nav
        (function injectTeamAnchorStyle() {
            const css = `.team-anchor { scroll-margin-top: calc(var(--nav-height, 4rem) + 1rem); }`;
            const s = document.createElement('style');
            s.setAttribute('data-generated','team-anchor-style');
            s.appendChild(document.createTextNode(css));
            document.head.appendChild(s);
        })();

        fetch('teams.json')
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('teams-container');
                container.innerHTML = data.teams.map((team, index) => buildTeamCard(team, index)).join('');
            })
            .catch(error => console.error('Error loading teams:', error));
    </script>
</body>
</html>
