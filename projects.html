<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dylan Kwok - Projects</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
        }
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Merriweather', serif;
        }
    </style>
</head>
<body class="bg-slate-900 text-white">

    <!-- Hamburger Menu Button -->
    <div class="fixed top-0 right-0 p-4 z-30">
        <button id="menu-btn" class="text-white focus:outline-none">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path>
            </svg>
        </button>
    </div>

    <!-- Navigation Menu -->
    <div id="menu" class="hidden fixed inset-0 bg-slate-900 bg-opacity-95 z-20 flex items-center justify-center">
        <div class="text-center">
            <a href="index.html" class="block text-4xl font-bold text-white py-4 hover:text-slate-300">Home</a>
            <a href="blog.html" class="block text-4xl font-bold text-white py-4 hover:text-slate-300">Blog</a>
            <a href="photos.html" class="block text-4xl font-bold text-white py-4 hover:text-slate-300">Photos</a>
            <a href="projects.html" class="block text-4xl font-bold text-white py-4 hover:text-slate-300">Projects</a>
        </div>
    </div>

    <section class="py-20">
        <div class="container mx-auto px-4">
            <h1 class="text-6xl font-bold text-center mb-12">My Projects</h1>
            <div class="text-center">
                <p class="text-xl">This page is under construction. Please check back soon for a showcase of my work!</p>
            </div>
        </div>
    </section>


    <!-- Footer -->
    <footer class="fixed bottom-0 w-full py-8 bg-slate-900">
        <div class="container mx-auto px-4 text-center">
            <p>&copy; 2024 Dylan Kwok</p>
        </div>
    </footer>

    <script>
        const menuBtn = document.getElementById('menu-btn');
        const menu = document.getElementById('menu');
        let isOpen = false;
    
        menuBtn.addEventListener('click', () => {
            isOpen = !isOpen;
            menu.classList.toggle('hidden');
            if (isOpen) {
                menuBtn.innerHTML = `<svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>`;
            } else {
                menuBtn.innerHTML = `<svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>`;
            }
        });
    </script>

</body>
</html>
