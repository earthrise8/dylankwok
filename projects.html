<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Dylan Kwok's Projects - Engineering projects, software development, and maker projects including rocketry, robotics, and educational initiatives.">
    <meta name="keywords" content="projects, engineering, rocketry, robotics, software development, maker projects, Dylan Kwok">
    <meta name="author" content="Dylan Kwok">
    <meta property="og:title" content="Dylan Kwok - Projects">
    <meta property="og:description" content="Engineering and maker projects showcasing innovation and technical expertise">
    <meta property="og:type" content="website">
    <title>Dylan Kwok - Projects</title>
    <link rel="icon" type="image/svg+xml" href="Dfavicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            padding-top: 4rem;
            font-family: 'Space Grotesk', sans-serif;
            background:
                radial-gradient(circle at top left, rgba(239, 68, 68, 0.10), transparent 22%),
                radial-gradient(circle at top right, rgba(56, 189, 248, 0.10), transparent 18%),
                linear-gradient(180deg, #09090b 0%, #050505 60%, #111111 100%);
        }
        h1, h2, h3, h4, h5, h6, .mono {
            font-family: 'IBM Plex Mono', monospace;
        }
        .panel {
            background: rgba(18, 18, 20, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.10);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(16px);
        }
        
        /* Menu slide-in and fade animation */
        #menu {
            transition: opacity 0.25s ease, transform 0.25s ease;
        }
        #menu.hidden {
            opacity: 0;
            transform: translateY(-1rem);
            pointer-events: none;
        }
        #menu:not(.hidden) {
            opacity: 1;
            transform: translateY(0);
        }
        
        /* Menu links fade-in with stagger */
        #menu a {
            opacity: 0;
            animation: fadeInDown 0.5s ease forwards;
        }
        #menu:not(.hidden) a:nth-child(1) { animation-delay: 0.1s; }
        #menu:not(.hidden) a:nth-child(2) { animation-delay: 0.2s; }
        #menu:not(.hidden) a:nth-child(3) { animation-delay: 0.3s; }
        #menu:not(.hidden) a:nth-child(4) { animation-delay: 0.4s; }
        #menu:not(.hidden) a:nth-child(5) { animation-delay: 0.5s; }
        #menu:not(.hidden) a:nth-child(6) { animation-delay: 0.6s; }
        
        
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        :root { --nav-height: 4rem; }

        /* Fixed tab bar */
        #site-tabs {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 40;
            display: flex;
            justify-content: center;
            padding: 0.5rem 1rem;
            background: linear-gradient(180deg, rgba(6,6,8,0.95), rgba(6,6,8,0.6));
            backdrop-filter: blur(6px);
        }

            #top-fade {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                height: 6rem;
                pointer-events: none;
                z-index: 30;
                background: linear-gradient(to bottom, rgba(6,6,8,0.88) 0%, rgba(6,6,8,0.58) 52%, rgba(6,6,8,0) 100%);
            }

        .tab { transition: color .12s ease, border-color .12s ease; padding-bottom: .35rem; }
        .tab.active { border-bottom-color: #38bdf8 !important; color: #38bdf8 !important; }
        
        /* Carousel styles */
        .carousel-container {
            position: relative;
            overflow: hidden;
            border-radius: 1.25rem;
            border: 1px solid rgba(255, 255, 255, 0.10);
        }
        
        .carousel-slide {
            width: 100%;
            height: 600px;
            background-size: cover;
            background-position: center;
            transition: opacity 0.5s ease;
        }
        
        .carousel-controls {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 10;
        }
        
        .carousel-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.45);
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }
        
        .carousel-dot.active {
            background-color: rgba(56, 189, 248, 1);
            transform: scale(1.3);
        }
        
        .carousel-nav-prev {
            left: 8px;
        }
        
        .carousel-nav-next {
            right: 8px;
        }
        
        .carousel-caption {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.82), transparent);
            color: white;
            padding: 16px;
            text-align: center;
            font-size: 14px;
        }

        .label {
            font-size: 0.72rem;
            letter-spacing: 0.34em;
            text-transform: uppercase;
        }

        /* Image modal/popup */
        .image-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            z-index: 100;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .image-modal.active {
            display: flex;
            opacity: 1;
        }

        .image-modal-content {
            position: relative;
            max-width: 90vw;
            max-height: 90vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .image-modal img {
            max-width: 100%;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 0.5rem;
        }

        .image-modal-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            width: 2.5rem;
            height: 2.5rem;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s ease;
        }

        .image-modal-close:hover {
            background: rgba(0, 0, 0, 0.9);
        }

        .carousel-slide {
            cursor: pointer;
        }

        .carousel-slide:hover {
            opacity: 0.9;
        }
    </style>
    <link rel="stylesheet" href="theme.css">
</head>
<body class="space-theme text-white">

    <div id="site-chrome-top"></div>

    <!-- Image Modal Popup -->
    <div id="image-modal" class="image-modal">
        <div class="image-modal-content">
            <button id="modal-close" class="image-modal-close" type="button">✕</button>
            <img id="modal-image" src="" alt="Full size image">
        </div>
    </div>

    <!-- Page Header -->
    <header class="border-b border-white/10 px-4 pt-28 pb-12 sm:px-6 lg:pt-32">
        <div class="mx-auto max-w-7xl">
            <p class="label text-red-300">Personal Systems Archive</p>
            <div class="mt-5 grid gap-8 lg:grid-cols-[1fr_0.9fr] lg:items-end">
                <div>
                    <h1 class="text-5xl font-semibold tracking-tight text-white sm:text-6xl lg:text-7xl">Projects</h1>
                    <p class="mt-5 max-w-3xl text-lg leading-8 text-zinc-300 sm:text-xl">Personal engineering and software projects, separated from team roles so the portfolio stays easy to scan and easy to trust.</p>
                </div>
                <div class="grid grid-cols-3 gap-3 text-center text-xs uppercase tracking-[0.25em] text-zinc-300">
                    <div class="rounded-2xl border border-white/10 bg-white/5 px-3 py-4">Engineering</div>
                    <div class="rounded-2xl border border-white/10 bg-white/5 px-3 py-4">Software</div>
                    <div class="rounded-2xl border border-white/10 bg-white/5 px-3 py-4">Maker</div>
                </div>
            </div>
        </div>
    </header>

    <!-- Projects Section -->
    <section class="px-4 py-16">
        <div class="container mx-auto">
            <div id="projects-container" class="mx-auto max-w-5xl space-y-12">
                <!-- Projects loaded dynamically from projects.json -->
            </div>
        </div>
    </section>

    <div id="site-chrome-bottom"></div>

    <script src="site-chrome.js"></script>
    <script>
        // Image modal functionality
        const imageModal = document.getElementById('image-modal');
        const modalImage = document.getElementById('modal-image');
        const modalClose = document.getElementById('modal-close');

        modalClose.addEventListener('click', () => {
            imageModal.classList.remove('active');
        });

        imageModal.addEventListener('click', (e) => {
            if (e.target === imageModal) {
                imageModal.classList.remove('active');
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && imageModal.classList.contains('active')) {
                imageModal.classList.remove('active');
            }
        });

        function initCarousel(container) {
            const slide = container.querySelector('.carousel-slide');
            const caption = container.querySelector('.carousel-caption');
            const prevBtn = container.querySelector('.carousel-nav-prev');
            const nextBtn = container.querySelector('.carousel-nav-next');
            const dots = Array.from(container.querySelectorAll('.carousel-dot'));
            const images = JSON.parse(container.dataset.images || '[]');
            const projectTitle = container.dataset.title || '';

            if (!slide || !caption || !prevBtn || !nextBtn) {
                return;
            }

            let currentIndex = 0;

            function render() {
                const current = images[currentIndex] || {};
                slide.style.backgroundImage = `url('${current.url || ''}')`;
                caption.textContent = current.caption || projectTitle;
                dots.forEach((dot, index) => dot.classList.toggle('active', index === currentIndex));
            }

            // Add click handler for opening modal
            slide.addEventListener('click', () => {
                const current = images[currentIndex] || {};
                if (current.url) {
                    modalImage.src = current.url;
                    imageModal.classList.add('active');
                }
            });

            prevBtn.addEventListener('click', () => {
                currentIndex = (currentIndex - 1 + images.length) % images.length;
                render();
            });

            nextBtn.addEventListener('click', () => {
                currentIndex = (currentIndex + 1) % images.length;
                render();
            });

            dots.forEach((dot, index) => {
                dot.addEventListener('click', () => {
                    currentIndex = index;
                    render();
                });
            });

            render();
        }

        fetch('projects.json')
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('projects-container');
                container.innerHTML = '';

                data.projects.forEach(project => {
                    const carouselId = `carousel-${project.id}`;
                    const images = Array.isArray(project.images) ? project.images : [];

                    const projectHTML = `
                        <article class="panel overflow-hidden rounded-[2rem]">
                            <div class="flex flex-col">
                                <div class="carousel-container" id="${carouselId}" data-title="${project.title.replace(/"/g, '&quot;')}" data-images='${JSON.stringify(images).replace(/'/g, '&apos;')}'>
                                    <div class="carousel-slide"></div>
                                    <button class="carousel-nav carousel-nav-prev" type="button">‹</button>
                                    <button class="carousel-nav carousel-nav-next" type="button">›</button>
                                    <div class="carousel-caption"></div>
                                    <div class="carousel-controls">
                                        ${images.map((_, idx) => `<div class="carousel-dot${idx === 0 ? ' active' : ''}"></div>`).join('')}
                                    </div>
                                </div>

                                <div class="p-6 sm:p-8 lg:p-10">
                                    <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
                                        <h2 class="text-2xl sm:text-3xl font-bold text-white">${project.title}</h2>
                                        <span class="rounded-full border border-blue-400/35 bg-white px-3 py-1 text-xs font-bold whitespace-nowrap text-black">${project.status}</span>
                                    </div>
                                    <p class="text-sm sm:text-base text-zinc-400 mb-6">${project.organization} • ${project.timeframe}</p>

                                    <p class="text-base sm:text-lg leading-relaxed text-zinc-300 mb-6">${project.description}</p>

                                    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 sm:gap-6">
                                        <div>
                                            <h3 class="text-lg font-bold text-white mb-3">Key Points</h3>
                                            <ul class="space-y-2 text-sm sm:text-base text-zinc-300">
                                                ${(project.accomplishments || []).map(item => `<li>• ${item}</li>`).join('')}
                                            </ul>
                                        </div>
                                        <div>
                                            <h3 class="text-lg font-bold text-white mb-3">Technologies</h3>
                                            <ul class="space-y-2 text-sm sm:text-base text-zinc-300">
                                                ${(project.technologies || []).map(item => `<li>• ${item}</li>`).join('')}
                                            </ul>
                                        </div>
                                    </div>

                                    ${project.link ? `<div class="mt-8"><a href="${project.link}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center rounded-full border border-red-400/40 bg-red-500 px-5 py-2.5 text-sm font-semibold text-white transition hover:bg-red-400">View Project</a></div>` : ''}
                                </div>
                            </div>
                        </article>
                    `;

                    container.insertAdjacentHTML('beforeend', projectHTML);
                    const carousel = document.getElementById(carouselId);
                    initCarousel(carousel);
                });
            })
            .catch(error => console.error('Error loading projects:', error));
    </script>

</body>
</html>
