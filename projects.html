        body {
            font-family: 'Montserrat', sans-serif;
        }
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Merriweather', serif;
        }
        
        /* Menu slide-in and fade animation */
        #menu {
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        #menu.hidden {
            opacity: 0;
            transform: translateX(100%);
            pointer-events: none;
        }
        #menu:not(.hidden) {
            opacity: 1;
            transform: translateX(0);
        }
        
        /* Menu links fade-in with stagger */
        #menu a {
            opacity: 0;
            animation: fadeInDown 0.5s ease forwards;
        }
        #menu:not(.hidden) a:nth-child(1) { animation-delay: 0.1s; }
        #menu:not(.hidden) a:nth-child(2) { animation-delay: 0.2s; }
        #menu:not(.hidden) a:nth-child(3) { animation-delay: 0.3s; }
        #menu:not(.hidden) a:nth-child(4) { animation-delay: 0.4s; }
        
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* Carousel styles */
        .carousel-container {
            position: relative;
            overflow: hidden;
            border-radius: 0.5rem;
        }
        
        .carousel-slide {
            width: 100%;
            height: 300px;
            background-size: cover;
            background-position: center;
            transition: opacity 0.5s ease;
        }
        
        .carousel-controls {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 10;
        }
        
        .carousel-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }
        
        .carousel-dot.active {
            background-color: rgba(34, 211, 238, 1);
            transform: scale(1.3);
        }
        
        .carousel-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.3s ease;
            font-size: 20px;
            z-index: 5;
        }
        
        .carousel-nav:hover {
            background-color: rgba(0, 0, 0, 0.8);
        }
        
        .carousel-nav-prev {
            left: 8px;
        }
        
        .carousel-nav-next {
            right: 8px;
        }
        
        .carousel-caption {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.7), transparent);
            color: white;
            padding: 16px;
            text-align: center;
            font-size: 14px;
        }
    </style>

    <script>
        // Menu toggle with slide and fade animation
        const menuBtn = document.getElementById('menu-btn');
        const menu = document.getElementById('menu');
        let isOpen = false;
    
        menuBtn.addEventListener('click', () => {
            isOpen = !isOpen;
            menu.classList.toggle('hidden');
            if (isOpen) {
                menuBtn.innerHTML = `<svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>`;
            } else {
                menuBtn.innerHTML = `<svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>`;
            }
        });

        // Carousel management
        class ProjectCarousel {
            constructor(containerId, images) {
                this.container = document.getElementById(containerId);
                this.images = images;
                this.currentIndex = 0;
                this.init();
            }

            init() {
                this.updateSlide();
                this.attachEventListeners();
            }

            updateSlide() {
                const slide = this.container.querySelector('.carousel-slide');
                slide.style.backgroundImage = `url('${this.images[this.currentIndex].url}')`;
                
                const caption = this.container.querySelector('.carousel-caption');
                caption.textContent = this.images[this.currentIndex].caption;

                // Update dots
                const dots = this.container.querySelectorAll('.carousel-dot');
                dots.forEach((dot, index) => {
                    dot.classList.toggle('active', index === this.currentIndex);
                });
            }

            attachEventListeners() {
                const prevBtn = this.container.querySelector('.carousel-nav-prev');
                const nextBtn = this.container.querySelector('.carousel-nav-next');
                const dots = this.container.querySelectorAll('.carousel-dot');

                prevBtn.addEventListener('click', () => this.prev());
                nextBtn.addEventListener('click', () => this.next());

                dots.forEach((dot, index) => {
                    dot.addEventListener('click', () => this.goTo(index));
                });
            }

            next() {
                this.currentIndex = (this.currentIndex + 1) % this.images.length;
                this.updateSlide();
            }

            prev() {
                this.currentIndex = (this.currentIndex - 1 + this.images.length) % this.images.length;
                this.updateSlide();
            }

            goTo(index) {
                this.currentIndex = index;
                this.updateSlide();
            }
        }

        // Load projects from JSON
        fetch('projects.json')
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('projects-container');
                
                data.projects.forEach((project, projectIndex) => {
                    const carouselId = `carousel-${project.id}`;
                    
                    const projectHTML = `
                        <article class="bg-slate-800 rounded-lg overflow-hidden">
                            <div class="flex flex-col">
                                <!-- Image Carousel -->
                                <div class="carousel-container" id="${carouselId}">
                                    <div class="carousel-slide"></div>
                                    <button class="carousel-nav carousel-nav-prev">‹</button>
                                    <button class="carousel-nav carousel-nav-next">›</button>
                                    <div class="carousel-caption"></div>
                                    <div class="carousel-controls">
                                        ${project.images.map((_, idx) => `<div class="carousel-dot${idx === 0 ? ' active' : ''}"></div>`).join('')}
                                    </div>
                                </div>

                                <!-- Project Info -->
                                <div class="p-6 sm:p-8">
                                    <div class="flex items-center justify-between mb-4 flex-wrap gap-2">
                                        <h2 class="text-2xl sm:text-3xl font-bold">${project.title}</h2>
                                        <span class="bg-cyan-400 text-slate-900 text-xs font-bold px-3 py-1 rounded whitespace-nowrap">${project.status}</span>
                                    </div>
                                    <p class="text-slate-400 mb-6 text-sm sm:text-base">${project.organization} • ${project.timeframe}</p>
                                    
                                    <p class="text-base sm:text-lg mb-6 leading-relaxed">${project.description}</p>
                                    
                                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 sm:gap-6">
                                        <div>
                                            <h3 class="text-lg font-bold mb-3">Key Points</h3>
                                            <ul class="space-y-2 text-sm sm:text-base text-slate-300">
                                                ${project.accomplishments.map(item => `<li>✓ ${item}</li>`).join('')}
                                            </ul>
                                        </div>
                                        <div>
                                            <h3 class="text-lg font-bold mb-3">Technologies</h3>
                                            <ul class="space-y-2 text-sm sm:text-base text-slate-300">
                                                ${project.technologies.map(item => `<li>• ${item}</li>`).join('')}
                                            </ul>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </article>
                    `;

                    container.innerHTML += projectHTML;

                    // Initialize carousel after adding to DOM
                    setTimeout(() => {
                        new ProjectCarousel(carouselId, project.images);
                    }, 0);
                });
            })
            .catch(error => console.error('Error loading projects:', error));
    </script>
