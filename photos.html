<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dylan Kwok - Photos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
        }
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Merriweather', serif;
        }
        .modal-container {
            transition: opacity 0.25s ease;
        }
    </style>
</head>
<body class="bg-slate-900 text-white">

    <!-- Hamburger Menu Button -->
    <div class="fixed top-0 right-0 p-4 z-30">
        <button id="menu-btn" class="text-white focus:outline-none">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path>
            </svg>
        </button>
    </div>

    <!-- Navigation Menu -->
    <div id="menu" class="hidden fixed inset-0 bg-slate-900 bg-opacity-95 z-20 flex items-center justify-center">
        <div class="text-center">
            <a href="index.html" class="block text-4xl font-bold text-white py-4 hover:text-slate-300">Home</a>
            <a href="blog.html" class="block text-4xl font-bold text-white py-4 hover:text-slate-300">Blog</a>
            <a href="photos.html" class="block text-4xl font-bold text-white py-4 hover:text-slate-300">Photos</a>
        </div>
    </div>

    <!-- Photo Gallery Section -->
    <section class="py-20">
        <div class="container mx-auto px-4">
            <h2 class="text-4xl font-bold text-center mb-12">Photo Gallery</h2>
            <div id="gallery" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                <!-- Photo Items -->
                <div class="gallery-item w-full h-64 bg-cover bg-center rounded-lg cursor-pointer" 
                     style="background-image: url('https://images.unsplash.com/photo-1516900448138-89341d9b12c5?q=80&w=2070&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D')"
                     data-description="A beautiful mountain landscape at sunset.">
                </div>
                <div class="gallery-item w-full h-64 bg-cover bg-center rounded-lg cursor-pointer" 
                     style="background-image: url('https://images.unsplash.com/photo-1506748686214-e9df14d4d9d0?q=80&w=1974&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D')"
                     data-description="A serene lake reflecting the surrounding forest and sky.">
                </div>
                <div class="gallery-item w-full h-64 bg-cover bg-center rounded-lg cursor-pointer" 
                     style="background-image: url('https://images.unsplash.com/photo-1470770841072-f978cf4d019e?q=80&w=2070&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D')"
                     data-description="A winding road through a lush, green forest.">
                </div>
                <div class="gallery-item w-full h-64 bg-cover bg-center rounded-lg cursor-pointer" 
                     style="background-image: url('https://images.unsplash.com/photo-1472214103451-9374bd1c798e?q=80&w=2070&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D')"
                     data-description="A green field with a single tree under a dramatic sky.">
                </div>
                <div class="gallery-item w-full h-64 bg-cover bg-center rounded-lg cursor-pointer" 
                     style="background-image: url('https://images.unsplash.com/photo-1501785888041-af3ef285b470?q=80&w=2070&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D')"
                     data-description="A stunning view of an Italian coastline village.">
                </div>
                <div class="gallery-item w-full h-64 bg-cover bg-center rounded-lg cursor-pointer" 
                     style="background-image: url('https://images.unsplash.com/photo-1447752875215-b2761acb3c5d?q=80&w=2070&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D')"
                     data-description="A misty forest floor with light filtering through the trees.">
                </div>
                <div class="gallery-item w-full h-64 bg-cover bg-center rounded-lg cursor-pointer" 
                     style="background-image: url('https://images.unsplash.com/photo-1580133318324-f2f76d9af932?q=80&w=1974&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D')"
                     data-description="Snow-capped mountains under a clear blue sky.">
                </div>
                <div class="gallery-item w-full h-64 bg-cover bg-center rounded-lg cursor-pointer" 
                     style="background-image: url('https://images.unsplash.com/photo-1433086966358-54859d0ed716?q=80&w=1974&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D')"
                     data-description="A powerful waterfall in a rocky, green landscape.">
                </div>
            </div>
        </div>
    </section>

    <!-- Modal -->
    <div id="modal" class="modal-container fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-30 opacity-0 pointer-events-none">
        <div class="bg-slate-800 rounded-lg p-4 max-w-3xl max-h-full overflow-auto">
            <img id="modal-img" src="" alt="Enlarged photo" class="w-full h-auto rounded-lg mb-4">
            <p id="modal-description" class="text-center"></p>
        </div>
    </div>

    <!-- Footer -->
    <footer class="py-8 bg-slate-900">
        <div class="container mx-auto px-4 text-center">
            <p>&copy; 2024 Dylan Kwok</p>
        </div>
    </footer>

    <script>
        const gallery = document.getElementById('gallery');
        const modal = document.getElementById('modal');
        const modalImg = document.getElementById('modal-img');
        const modalDescription = document.getElementById('modal-description');

        gallery.addEventListener('click', (e) => {
            if (e.target.classList.contains('gallery-item')) {
                const imageUrl = e.target.style.backgroundImage.slice(4, -1).replace(/"/g, "");
                const description = e.target.dataset.description;

                modalImg.src = imageUrl;
                modalDescription.textContent = description;
                modal.classList.remove('opacity-0', 'pointer-events-none');
            }
        });

        modal.addEventListener('click', () => {
            modal.classList.add('opacity-0', 'pointer-events-none');
        });

        const menuBtn = document.getElementById('menu-btn');
        const menu = document.getElementById('menu');
        let isOpen = false;
    
        menuBtn.addEventListener('click', () => {
            isOpen = !isOpen;
            menu.classList.toggle('hidden');
            if (isOpen) {
                menuBtn.innerHTML = `<svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>`;
            } else {
                menuBtn.innerHTML = `<svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>`;
            }
        });
    </script>

</body>
</html>
