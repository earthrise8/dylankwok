<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Dylan Kwok's Photo Gallery - A collection of photography from travels, natural landscapes, and personal moments.">
    <meta name="keywords" content="photography, photo gallery, Dylan Kwok, landscape photography, travel photography">
    <meta name="author" content="Dylan Kwok">
    <meta property="og:title" content="Dylan Kwok - Photos">
    <meta property="og:description" content="Photo Gallery - A collection of photography from travels and personal moments">
    <meta property="og:type" content="website">
    <title>Dylan Kwok - Photos</title>
    <link rel="icon" type="image/svg+xml" href="Dfavicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Space Grotesk', sans-serif;
        }

        h1, h2, h3, h4, h5, h6, .mono {
            font-family: 'IBM Plex Mono', monospace;
        }

        .modal-container {
            transition: opacity 0.25s ease;
        }
        
        /* Menu slide-in and fade animation */
        #menu {
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        #menu.hidden {
            opacity: 0;
            transform: translateX(100%);
            pointer-events: none;
        }
        #menu:not(.hidden) {
            opacity: 1;
            transform: translateX(0);
        }
        
        /* Menu links fade-in with stagger */
        #menu a {
            opacity: 0;
            animation: fadeInDown 0.5s ease forwards;
        }
        #menu:not(.hidden) a:nth-child(1) { animation-delay: 0.1s; }
        #menu:not(.hidden) a:nth-child(2) { animation-delay: 0.2s; }
        #menu:not(.hidden) a:nth-child(3) { animation-delay: 0.3s; }
        #menu:not(.hidden) a:nth-child(4) { animation-delay: 0.4s; }
        #menu:not(.hidden) a:nth-child(5) { animation-delay: 0.5s; }
        #menu:not(.hidden) a:nth-child(6) { animation-delay: 0.6s; }
        
        
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        :root { --nav-height: 4rem; }

        /* Fixed tab bar */
        #site-tabs {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 40;
            display: flex;
            justify-content: center;
            padding: 0.5rem 1rem;
            background: linear-gradient(180deg, rgba(15,15,20,0.95), rgba(15,15,20,0.6));
            backdrop-filter: blur(6px);
        }

            #top-fade {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                height: 6rem;
                pointer-events: none;
                z-index: 30;
                background: linear-gradient(to bottom, rgba(5,5,5,0.88) 0%, rgba(5,5,5,0.58) 52%, rgba(5,5,5,0) 100%);
        }

        .tab { transition: color .12s ease, border-color .12s ease; padding-bottom: .35rem; }
        .tab.active { border-bottom-color: #06b6d4 !important; color: #06b6d4 !important; }
    </style>
    <link rel="stylesheet" href="theme.css">
</head>
<body class="space-theme text-white">

    <div id="site-chrome-top"></div>

    <header class="border-b border-white/10 px-4 pt-28 pb-12 sm:px-6 lg:pt-32">
        <div class="mx-auto max-w-7xl">
            <p class="label text-red-300">Gallery / Archive</p>
            <div class="mt-5 grid gap-8 lg:grid-cols-[1fr_0.9fr] lg:items-end">
                <div>
                    <h1 class="text-5xl font-semibold tracking-tight text-white sm:text-6xl lg:text-7xl">Photo Gallery</h1>
                    <p class="mt-5 max-w-3xl text-lg leading-8 text-zinc-300 sm:text-xl">A visual archive of travel, landscapes, and personal moments. Use the controls below to sort by time or group by region.</p>
                </div>
                <div class="grid grid-cols-3 gap-3 text-center text-xs uppercase tracking-[0.25em] text-zinc-300">
                    <div class="rounded-2xl border border-white/10 bg-white/5 px-3 py-4">Newest</div>
                    <div class="rounded-2xl border border-white/10 bg-white/5 px-3 py-4">Regions</div>
                    <div class="rounded-2xl border border-white/10 bg-white/5 px-3 py-4">Travel</div>
                </div>
            </div>
        </div>
    </header>

    <!-- Photo Gallery Section -->
    <section class="py-20">
        <div class="container mx-auto px-4">
            <div class="mb-8 flex flex-col items-center gap-3 sm:flex-row sm:justify-between">
                <p class="text-sm text-zinc-400">Sort photos by time or region.</p>
                <label class="flex items-center gap-3 text-sm text-zinc-300">
                    <span class="mono uppercase tracking-[0.28em] text-xs text-red-300">Sort</span>
                    <select id="sort-select" class="rounded-full border border-white/10 bg-black/30 px-4 py-2 text-sm text-white outline-none transition focus:border-red-400/60">
                        <option value="newest">Newest first</option>
                        <option value="oldest">Oldest first</option>
                        <option value="region-az">Region A-Z</option>
                        <option value="region-za">Region Z-A</option>
                    </select>
                </label>
            </div>
            <div id="gallery" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                <!-- Photos loaded from photos.json -->
            </div>
        </div>
    </section>

    <!-- Modal -->
    <div id="modal" class="modal-container fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-30 opacity-0 pointer-events-none">
        <div class="bg-slate-800 rounded-lg p-4 max-w-3xl max-h-full overflow-auto">
            <img id="modal-img" src="" alt="Enlarged photo" class="w-full h-auto rounded-lg mb-4">
            <p id="modal-description" class="text-center"></p>
        </div>
    </div>

    <div id="site-chrome-bottom"></div>

    <script src="site-chrome.js"></script>

    <script>
        const gallery = document.getElementById('gallery');
        const sortSelect = document.getElementById('sort-select');
        const modal = document.getElementById('modal');
        const modalImg = document.getElementById('modal-img');
        const modalDescription = document.getElementById('modal-description');
        let photos = [];

        function normalizeRegion(photo) {
            return (photo.category || photo.location || 'Unknown').toString().trim().toLowerCase();
        }

        function regionLabel(photo) {
            return photo.category || photo.location || 'Unknown';
        }

        function sortPhotos(items, sortMode) {
            const sorted = [...items];

            switch (sortMode) {
                case 'oldest':
                    return sorted.sort((left, right) => new Date(left.date) - new Date(right.date));
                case 'region-az':
                    return sorted.sort((left, right) => {
                        const regionCompare = normalizeRegion(left).localeCompare(normalizeRegion(right));
                        return regionCompare !== 0 ? regionCompare : new Date(right.date) - new Date(left.date);
                    });
                case 'region-za':
                    return sorted.sort((left, right) => {
                        const regionCompare = normalizeRegion(right).localeCompare(normalizeRegion(left));
                        return regionCompare !== 0 ? regionCompare : new Date(right.date) - new Date(left.date);
                    });
                case 'newest':
                default:
                    return sorted.sort((left, right) => new Date(right.date) - new Date(left.date));
            }
        }

        function renderGallery() {
            const sortMode = sortSelect.value;
            const sortedPhotos = sortPhotos(photos, sortMode);

            gallery.innerHTML = '';

            sortedPhotos.forEach(photo => {
                const photoElement = document.createElement('div');
                photoElement.className = 'gallery-item w-full rounded-lg cursor-pointer overflow-hidden flex flex-col border border-white/10 bg-black/20 transition hover:border-red-400/60 hover:opacity-95';
                
                const imgWrapper = document.createElement('div');
                imgWrapper.className = 'flex-1 bg-contain bg-center bg-no-repeat';
                imgWrapper.style.backgroundImage = `url('${photo.imageUrl}')`;
                imgWrapper.style.minHeight = '250px';
                
                const infoDiv = document.createElement('div');
                infoDiv.className = 'bg-[#2a0f10] border-t border-red-400/20 p-3 text-sm';
                infoDiv.innerHTML = `
                    <div class="flex items-start justify-between gap-3">
                        <p class="font-semibold">${photo.title}</p>
                        <span class="rounded-full border border-red-400/30 bg-black/30 px-2 py-0.5 text-[10px] font-semibold uppercase tracking-[0.24em] text-red-200">${regionLabel(photo)}</span>
                    </div>
                    <p class="text-red-200 text-xs mt-1">${photo.date}</p>
                    ${photo.location ? `<p class="text-red-200 text-xs">${photo.location}</p>` : ''}
                `;
                
                photoElement.appendChild(imgWrapper);
                photoElement.appendChild(infoDiv);
                
                photoElement.dataset.description = photo.description;
                photoElement.dataset.imageUrl = photo.imageUrl;
                photoElement.dataset.date = photo.date;
                photoElement.dataset.location = photo.location || '';
                photoElement.dataset.title = photo.title;
                gallery.appendChild(photoElement);
            });

            attachGalleryListeners();
        }

        // Load photos from JSON
        fetch('photos.json')
            .then(response => response.json())
            .then(data => {
                photos = data.photos || [];
                renderGallery();
            })
            .catch(error => console.error('Error loading photos:', error));

        sortSelect.addEventListener('change', renderGallery);

        function attachGalleryListeners() {
            const galleryItems = document.querySelectorAll('.gallery-item');
            galleryItems.forEach(item => {
                item.addEventListener('click', () => {
                    const imageUrl = item.dataset.imageUrl;
                    const description = item.dataset.description;
                    const date = item.dataset.date;
                    const location = item.dataset.location;
                    const title = item.dataset.title;

                    modalImg.src = imageUrl;
                    modalDescription.innerHTML = `
                        <p class="text-lg font-semibold mb-2">${title}</p>
                        <p class="mb-2">${description}</p>
                        <p class="text-sm text-slate-400">📅 ${date}${location ? ` • 📍 ${location}` : ''}</p>
                    `;
                    modal.classList.remove('opacity-0', 'pointer-events-none');
                });
            });
        }

        modal.addEventListener('click', () => {
            modal.classList.add('opacity-0', 'pointer-events-none');
        });

    </script>


</body>
</html>
