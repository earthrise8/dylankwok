        :root {

        html { scroll-behavior: smooth; }

        body {

            font-family: 'Space Grotesk', sans-serif;
            color: var(--text);
            background:

                radial-gradient(circle at 50% 90%, rgba(255, 255, 255, 0.07), transparent 24%),
                linear-gradient(180deg, #09090b 0%, #050505 55%, #111111 100%);

        h1, h2, h3, h4, h5, h6, .mono { font-family: 'IBM Plex Mono', monospace; }

        .panel { background: var(--panel); border: 1px solid var(--line); box-shadow: 0 24px 80px rgba(0,0,0,0.35); backdrop-filter: blur(16px); overflow: hidden; }
        .panel img { display:block; width:100%; height:auto; max-height:520px; object-fit:cover; }

        .tab { transition: color 0.15s ease, background 0.15s ease, border-color 0.15s ease; padding-bottom:0.35rem; }
        .tab.active { border-bottom-color: var(--blue) !important; color: var(--blue) !important; background: rgba(255,255,255,0.02); }

        :root { --nav-height: 4rem; }
        #site-tabs { position: fixed; top:0; left:0; right:0; z-index:40; display:flex; justify-content:center; padding:0.5rem 1rem; background: linear-gradient(180deg, rgba(6,6,8,0.85), rgba(6,6,8,0.6)); backdrop-filter: blur(6px); }

    <script>
        const gallery = document.getElementById('gallery');
        const modal = document.getElementById('modal');
        const modalImg = document.getElementById('modal-img');
        const modalDescription = document.getElementById('modal-description');

        // Load photos from JSON
        fetch('photos.json')
            .then(response => response.json())
            .then(data => {
                data.photos.forEach(photo => {
                    const photoElement = document.createElement('div');
                    photoElement.className = 'gallery-item w-full rounded-lg cursor-pointer hover:opacity-90 transition overflow-hidden flex flex-col';
                    
                    const imgWrapper = document.createElement('div');
                    imgWrapper.className = 'flex-1 bg-contain bg-center bg-no-repeat';
                    imgWrapper.style.backgroundImage = `url('${photo.imageUrl}')`;
                    imgWrapper.style.minHeight = '250px';
                    
                    const infoDiv = document.createElement('div');
                    infoDiv.className = 'bg-slate-700 p-3 text-sm';
                    infoDiv.innerHTML = `
                        <p class="font-semibold">${photo.title}</p>
                        <p class="text-slate-300 text-xs mt-1">${photo.date}</p>
                        ${photo.location ? `<p class="text-slate-300 text-xs">${photo.location}</p>` : ''}
                    `;
                    
                    photoElement.appendChild(imgWrapper);
                    photoElement.appendChild(infoDiv);
                    
                    photoElement.dataset.description = photo.description;
                    photoElement.dataset.imageUrl = photo.imageUrl;
                    photoElement.dataset.date = photo.date;
                    photoElement.dataset.location = photo.location || '';
                    photoElement.dataset.title = photo.title;
                    gallery.appendChild(photoElement);
                });
                attachGalleryListeners();
            })
            .catch(error => console.error('Error loading photos:', error));

        function attachGalleryListeners() {
            const galleryItems = document.querySelectorAll('.gallery-item');
            galleryItems.forEach(item => {
                item.addEventListener('click', () => {
                    const imageUrl = item.dataset.imageUrl;
                    const description = item.dataset.description;
                    const date = item.dataset.date;
                    const location = item.dataset.location;
                    const title = item.dataset.title;

                    modalImg.src = imageUrl;
                    modalDescription.innerHTML = `
                        <p class="text-lg font-semibold mb-2">${title}</p>
                        <p class="mb-2">${description}</p>
                        <p class="text-sm text-slate-400">📅 ${date}${location ? ` • 📍 ${location}` : ''}</p>
                    `;
                    modal.classList.remove('opacity-0', 'pointer-events-none');
                });
            });
        }

        modal.addEventListener('click', () => {
            modal.classList.add('opacity-0', 'pointer-events-none');
        });

        const menuBtn = document.getElementById('menu-btn');
        const siteTabs = document.getElementById('site-tabs');

        const menuIcon = `<svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>`;
        const closeIcon = `<svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>`;

        menuBtn.addEventListener('click', () => {
            siteTabs.classList.toggle('hidden');
            const isOpen = !siteTabs.classList.contains('hidden');
            menuBtn.innerHTML = isOpen ? closeIcon : menuIcon;
        });

        (function activateTabs(){
            const tabs = document.querySelectorAll('#site-tabs .tab');
            const currentFile = (window.location.pathname.split('/').pop() || 'index.html');
            tabs.forEach(tab => {
                const href = tab.getAttribute('href') || '';
                if (href.endsWith(currentFile) || (currentFile === '' && href.endsWith('index.html'))) {
                    tab.classList.add('active');
                }
                tab.addEventListener('click', () => {
                    tabs.forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                });
            });
        })();
    </script>
