    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
        }
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Merriweather', serif;
        }
        .modal-container {
            transition: opacity 0.25s ease;
        }
        
        /* Menu slide-in and fade animation */
        #menu {
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        #menu.hidden {
            opacity: 0;
            transform: translateX(100%);
            pointer-events: none;
        }
        #menu:not(.hidden) {
            opacity: 1;
            transform: translateX(0);
        }
        
        /* Menu links fade-in with stagger */
        #menu a {
            opacity: 0;
            animation: fadeInDown 0.5s ease forwards;
        }
        #menu:not(.hidden) a:nth-child(1) { animation-delay: 0.1s; }
        #menu:not(.hidden) a:nth-child(2) { animation-delay: 0.2s; }
        #menu:not(.hidden) a:nth-child(3) { animation-delay: 0.3s; }
        #menu:not(.hidden) a:nth-child(4) { animation-delay: 0.4s; }
        
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

            </svg>
        </button>
    </div>

    <!-- Navigation Menu -->
    <div id="menu" class="hidden fixed inset-0 bg-slate-900 bg-opacity-95 z-20 flex items-center justify-center">
        <div class="text-center">
            <a href="index.html" class="block text-4xl font-bold text-white py-4 hover:text-slate-300">Home</a>
            <a href="blog.html" class="block text-4xl font-bold text-white py-4 hover:text-slate-300">Blog</a>
            <a href="photos.html" class="block text-4xl font-bold text-white py-4 hover:text-slate-300">Photos</a>

    <!-- Photo Gallery Section -->
    <section class="py-20">
        <div class="container mx-auto px-4">

            <p class="text-center text-slate-400 mb-12">Edit <code class="text-cyan-400">photos.json</code> to add or update photos</p>
            <div id="gallery" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">

    <script>
        const gallery = document.getElementById('gallery');
        const modal = document.getElementById('modal');
        const modalImg = document.getElementById('modal-img');
        const modalDescription = document.getElementById('modal-description');

        // Load photos from JSON
        fetch('photos.json')
            .then(response => response.json())
            .then(data => {
                data.photos.forEach(photo => {
                    const photoElement = document.createElement('div');
                    photoElement.className = 'gallery-item w-full h-64 bg-cover bg-center rounded-lg cursor-pointer hover:opacity-90 transition';
                    photoElement.style.backgroundImage = `url('${photo.imageUrl}')`;
                    photoElement.dataset.description = photo.description;
                    photoElement.dataset.imageUrl = photo.imageUrl;
                    gallery.appendChild(photoElement);
                });
                attachGalleryListeners();
            })
            .catch(error => console.error('Error loading photos:', error));

        function attachGalleryListeners() {
            const galleryItems = document.querySelectorAll('.gallery-item');
            galleryItems.forEach(item => {
                item.addEventListener('click', () => {
                    const imageUrl = item.dataset.imageUrl;
                    const description = item.dataset.description;

                    modalImg.src = imageUrl;
                    modalDescription.textContent = description;
                    modal.classList.remove('opacity-0', 'pointer-events-none');
                });
            });
        }

        modal.addEventListener('click', () => {
            modal.classList.add('opacity-0', 'pointer-events-none');
        });

        const menuBtn = document.getElementById('menu-btn');
        const menu = document.getElementById('menu');
        let isOpen = false;
    
        menuBtn.addEventListener('click', () => {
            isOpen = !isOpen;
            menu.classList.toggle('hidden');
            if (isOpen) {
                menuBtn.innerHTML = `<svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>`;
            } else {
                menuBtn.innerHTML = `<svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>`;
            }
        });
    </script>

</body>
