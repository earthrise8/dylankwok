<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Dylan Kwok's Photo Gallery - A collection of photography from travels, natural landscapes, and personal moments.">
    <meta name="keywords" content="photography, photo gallery, Dylan Kwok, landscape photography, travel photography">
    <meta name="author" content="Dylan Kwok">
    <meta property="og:title" content="Dylan Kwok - Photos">
    <meta property="og:description" content="Photo Gallery - A collection of photography from travels and personal moments">
    <meta property="og:type" content="website">
    <title>Dylan Kwok - Photos</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23334155'/><text x='50' y='75' font-size='80' font-weight='bold' fill='%23ffffff' text-anchor='middle' dominant-baseline='middle'>D</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Space Grotesk', sans-serif;
        }

        h1, h2, h3, h4, h5, h6, .mono {
            font-family: 'IBM Plex Mono', monospace;
        }

        .modal-container {
            transition: opacity 0.25s ease;
        }
        
        /* Menu slide-in and fade animation */
        #menu {
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        #menu.hidden {
            opacity: 0;
            transform: translateX(100%);
            pointer-events: none;
        }
        #menu:not(.hidden) {
            opacity: 1;
            transform: translateX(0);
        }
        
        /* Menu links fade-in with stagger */
        #menu a {
            opacity: 0;
            animation: fadeInDown 0.5s ease forwards;
        }
        #menu:not(.hidden) a:nth-child(1) { animation-delay: 0.1s; }
        #menu:not(.hidden) a:nth-child(2) { animation-delay: 0.2s; }
        #menu:not(.hidden) a:nth-child(3) { animation-delay: 0.3s; }
        #menu:not(.hidden) a:nth-child(4) { animation-delay: 0.4s; }
        #menu:not(.hidden) a:nth-child(5) { animation-delay: 0.5s; }
        #menu:not(.hidden) a:nth-child(6) { animation-delay: 0.6s; }
        
        
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        :root { --nav-height: 4rem; }

        /* Fixed tab bar */
        #site-tabs {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 40;
            display: flex;
            justify-content: center;
            padding: 0.5rem 1rem;
            background: linear-gradient(180deg, rgba(15,15,20,0.95), rgba(15,15,20,0.6));
            backdrop-filter: blur(6px);
        }

            #top-fade {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                height: 6rem;
                pointer-events: none;
                z-index: 30;
                background: linear-gradient(to bottom, rgba(5,5,5,0.88) 0%, rgba(5,5,5,0.58) 52%, rgba(5,5,5,0) 100%);
        }

        .tab { transition: color .12s ease, border-color .12s ease; padding-bottom: .35rem; }
        .tab.active { border-bottom-color: #06b6d4 !important; color: #06b6d4 !important; }
    </style>
    <link rel="stylesheet" href="theme.css">
</head>
<body class="space-theme text-white">

    <div id="site-chrome-top"></div>

    <!-- Photo Gallery Section -->
    <section class="py-20">
        <div class="container mx-auto px-4">
            <h2 class="text-4xl font-bold text-center mb-12">Photo Gallery</h2>
            <div id="gallery" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                <!-- Photos loaded from photos.json -->
            </div>
        </div>
    </section>

    <!-- Modal -->
    <div id="modal" class="modal-container fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-30 opacity-0 pointer-events-none">
        <div class="bg-slate-800 rounded-lg p-4 max-w-3xl max-h-full overflow-auto">
            <img id="modal-img" src="" alt="Enlarged photo" class="w-full h-auto rounded-lg mb-4">
            <p id="modal-description" class="text-center"></p>
        </div>
    </div>

    <div id="site-chrome-bottom"></div>

    <script src="site-chrome.js"></script>

    <script>
        const gallery = document.getElementById('gallery');
        const modal = document.getElementById('modal');
        const modalImg = document.getElementById('modal-img');
        const modalDescription = document.getElementById('modal-description');

        // Load photos from JSON
        fetch('photos.json')
            .then(response => response.json())
            .then(data => {
                data.photos.forEach(photo => {
                    const photoElement = document.createElement('div');
                    photoElement.className = 'gallery-item w-full rounded-lg cursor-pointer hover:opacity-90 transition overflow-hidden flex flex-col';
                    
                    const imgWrapper = document.createElement('div');
                    imgWrapper.className = 'flex-1 bg-contain bg-center bg-no-repeat';
                    imgWrapper.style.backgroundImage = `url('${photo.imageUrl}')`;
                    imgWrapper.style.minHeight = '250px';
                    
                    const infoDiv = document.createElement('div');
                    infoDiv.className = 'bg-slate-700 p-3 text-sm';
                    infoDiv.innerHTML = `
                        <p class="font-semibold">${photo.title}</p>
                        <p class="text-slate-300 text-xs mt-1">${photo.date}</p>
                        ${photo.location ? `<p class="text-slate-300 text-xs">${photo.location}</p>` : ''}
                    `;
                    
                    photoElement.appendChild(imgWrapper);
                    photoElement.appendChild(infoDiv);
                    
                    photoElement.dataset.description = photo.description;
                    photoElement.dataset.imageUrl = photo.imageUrl;
                    photoElement.dataset.date = photo.date;
                    photoElement.dataset.location = photo.location || '';
                    photoElement.dataset.title = photo.title;
                    gallery.appendChild(photoElement);
                });
                attachGalleryListeners();
            })
            .catch(error => console.error('Error loading photos:', error));

        function attachGalleryListeners() {
            const galleryItems = document.querySelectorAll('.gallery-item');
            galleryItems.forEach(item => {
                item.addEventListener('click', () => {
                    const imageUrl = item.dataset.imageUrl;
                    const description = item.dataset.description;
                    const date = item.dataset.date;
                    const location = item.dataset.location;
                    const title = item.dataset.title;

                    modalImg.src = imageUrl;
                    modalDescription.innerHTML = `
                        <p class="text-lg font-semibold mb-2">${title}</p>
                        <p class="mb-2">${description}</p>
                        <p class="text-sm text-slate-400">📅 ${date}${location ? ` • 📍 ${location}` : ''}</p>
                    `;
                    modal.classList.remove('opacity-0', 'pointer-events-none');
                });
            });
        }

        modal.addEventListener('click', () => {
            modal.classList.add('opacity-0', 'pointer-events-none');
        });

    </script>


</body>
</html>
